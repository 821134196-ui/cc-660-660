# 数据源：SQLite 本地文件
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:data/helmet.db
# SQLite 单写者，连接池限制为 1 避免 database is locked
quarkus.datasource.jdbc.max-size=1

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

quarkus.http.port=8080
quarkus.http.cors=true

# 检查附件：multipart 临时目录 + 正式存储目录（均为本地路径）
quarkus.http.body.uploads-directory=data/tmp-uploads
helmet.attachments.dir=data/attachments

# 测试：独立临时库，避免污染正式数据
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test-helmet.db
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.helmet.attachments.dir=target/test-attachments
%test.quarkus.http.body.uploads-directory=target/test-tmp-uploads
