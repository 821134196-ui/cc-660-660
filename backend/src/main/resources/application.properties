# 工厂安全帽受冲击退役判定系统 —— 后端配置

quarkus.application.name=safety-helmet
quarkus.http.port=8080

# ---- SQLite 数据源（Quarkiverse 扩展；本地文件落在 ./data 目录）----
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:data/safetyhelmet.db?foreign_keys=true
# SQLite 为单文件库，单连接串行访问可避免 database is locked
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.min-size=0

# ---- Hibernate ORM + SQLite 社区方言 ----
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ---- 业务配置 ----
safetyhelmet.upload.dir=data/uploads
safetyhelmet.default-service-life-years=3

# 请求体上限（附件以 base64 提交，预留 20MB）
quarkus.http.limits.max-body-size=20M

# 库存编辑 DTO 不含状态字段；收到未知字段（如试图夹带 status）直接 400
quarkus.jackson.fail-on-unknown-properties=true

# ---- 测试环境：独立库文件，每次重建 ----
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test-helmet.db?foreign_keys=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.safetyhelmet.upload.dir=target/test-uploads
